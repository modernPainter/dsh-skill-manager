# dsh-skill-manager bundle patch: inserts the dual-face plugin row into the web
# profile roster. Derived from dsh-skill-hub (MIT) — this package replaces it,
# do not install both at once (they share the `skill-hub` entry id).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (skill catalog + own Git repositories + scenes), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: skill-hub
      name: 'dsh-skill-manager'
